name: scholens

x-api-image: &api-image
  image: ${SCHOLENS_API_IMAGE:?SCHOLENS_API_IMAGE must be a digest-qualified reference}

x-jobs-image: &jobs-image
  image: ${SCHOLENS_JOBS_IMAGE:?SCHOLENS_JOBS_IMAGE must be a digest-qualified reference}

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-broker-environment: &broker-environment
  CELERY_BROKER_URL: amqp://scholens:${SCHOLENS_RABBITMQ_PASSWORD:?SCHOLENS_RABBITMQ_PASSWORD is required}@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://:${SCHOLENS_REDIS_PASSWORD:?SCHOLENS_REDIS_PASSWORD is required}@redis:6379/0
  CELERY_API_URL: http://jobs-api:8001
  WEBHOOK_BASE_URL: http://api:8000

x-storage-environment: &storage-environment
  AWS_REGION: ${SCHOLENS_AWS_REGION:?SCHOLENS_AWS_REGION is required}
  S3_BUCKET_NAME: ${SCHOLENS_S3_BUCKET_NAME:?SCHOLENS_S3_BUCKET_NAME is required}
  CLOUDFLARE_BUCKET_NAME: ${SCHOLENS_CLOUDFLARE_BUCKET_NAME:?SCHOLENS_CLOUDFLARE_BUCKET_NAME is required}

x-jobs-environment: &jobs-environment
  <<: [*broker-environment, *storage-environment]
  ENVIRONMENT: production
  DEEPSEEK_API_KEY: ${SCHOLENS_DEEPSEEK_API_KEY:?SCHOLENS_DEEPSEEK_API_KEY is required}
  DEEPSEEK_BASE_URL: ${SCHOLENS_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_STANDARD_MODEL: ${SCHOLENS_DEEPSEEK_STANDARD_MODEL:-deepseek-v4-flash}
  DEEPSEEK_REQUEST_TIMEOUT_SECONDS: ${SCHOLENS_DEEPSEEK_REQUEST_TIMEOUT_SECONDS:-120}
  DEEPSEEK_MAX_OUTPUT_TOKENS: ${SCHOLENS_DEEPSEEK_MAX_OUTPUT_TOKENS:-8192}
  DEEPSEEK_MAX_RETRIES: ${SCHOLENS_DEEPSEEK_MAX_RETRIES:-2}
  DEEPSEEK_STRUCTURED_RETRIES: ${SCHOLENS_DEEPSEEK_STRUCTURED_RETRIES:-2}
  DEEPSEEK_MAX_INPUT_CHARS: ${SCHOLENS_DEEPSEEK_MAX_INPUT_CHARS:-300000}
  MINERU_API_TOKEN: ${SCHOLENS_MINERU_API_TOKEN:?SCHOLENS_MINERU_API_TOKEN is required}
  MINERU_API_BASE_URL: ${SCHOLENS_MINERU_API_BASE_URL:-https://mineru.net/api/v4}
  MINERU_MODEL_VERSION: ${SCHOLENS_MINERU_MODEL_VERSION:-vlm}
  MINERU_POLL_INTERVAL_SECONDS: ${SCHOLENS_MINERU_POLL_INTERVAL_SECONDS:-3}
  MINERU_TASK_TIMEOUT_SECONDS: ${SCHOLENS_MINERU_TASK_TIMEOUT_SECONDS:-600}
  MINERU_REQUEST_TIMEOUT_SECONDS: ${SCHOLENS_MINERU_REQUEST_TIMEOUT_SECONDS:-60}
  MINERU_MAX_ARCHIVE_BYTES: ${SCHOLENS_MINERU_MAX_ARCHIVE_BYTES:-268435456}
  MOSS_API_KEY: ${SCHOLENS_MOSS_API_KEY:?SCHOLENS_MOSS_API_KEY is required}
  MOSS_API_BASE_URL: ${SCHOLENS_MOSS_API_BASE_URL:-https://api.mosi.cn/v1}
  MOSS_TTS_MODEL: ${SCHOLENS_MOSS_TTS_MODEL:-moss-tts}
  MOSS_VOICE_ID: ${SCHOLENS_MOSS_VOICE_ID:?SCHOLENS_MOSS_VOICE_ID is required}
  MOSS_POLL_INTERVAL_SECONDS: ${SCHOLENS_MOSS_POLL_INTERVAL_SECONDS:-3}
  MOSS_TASK_TIMEOUT_SECONDS: ${SCHOLENS_MOSS_TASK_TIMEOUT_SECONDS:-600}
  MOSS_MAX_AUDIO_BYTES: ${SCHOLENS_MOSS_MAX_AUDIO_BYTES:-104857600}
  PDF_PARSE_REDIS_URL: redis://:${SCHOLENS_REDIS_PASSWORD:?SCHOLENS_REDIS_PASSWORD is required}@redis:6379/0
  JOBS_WEBHOOK_SIGNING_SECRET: ${SCHOLENS_JOBS_WEBHOOK_SIGNING_SECRET:?SCHOLENS_JOBS_WEBHOOK_SIGNING_SECRET is required}
  POSTHOG_API_KEY: ${SCHOLENS_POSTHOG_API_KEY:-}
  DEBUG: "false"

services:
  client:
    image: ${SCHOLENS_CLIENT_IMAGE:?SCHOLENS_CLIENT_IMAGE must be a digest-qualified reference}
    <<: *restart
    expose:
      - "3000"
    networks:
      edge:
        aliases:
          - scholens-client
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  api:
    <<: [*api-image, *restart]
    environment:
      <<: [*broker-environment, *storage-environment]
      DATABASE_URL: ${SCHOLENS_APP_DATABASE_URL:?SCHOLENS_APP_DATABASE_URL is required}
      AUTH_JWT_SECRET: ${SCHOLENS_AUTH_JWT_SECRET:?SCHOLENS_AUTH_JWT_SECRET is required}
      AUTH_JWT_ACCESS_TOKEN_TTL_MINUTES: ${SCHOLENS_AUTH_JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      AUTH_JWT_REFRESH_TOKEN_TTL_DAYS: ${SCHOLENS_AUTH_JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      AUTH_ACCOUNT_LOCKOUT_THRESHOLD: ${SCHOLENS_AUTH_ACCOUNT_LOCKOUT_THRESHOLD:-5}
      AUTH_ACCOUNT_LOCKOUT_DURATION_MINUTES: ${SCHOLENS_AUTH_ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      AUTH_PUBLIC_WEB_URL: https://${SCHOLENS_DOMAIN:?SCHOLENS_DOMAIN is required}
      AUTH_PG_SSL_ROOT_CERT: /etc/ssl/certs/global-bundle.pem
      AUTH_PG_POOL_MIN_SIZE: ${SCHOLENS_AUTH_PG_POOL_MIN_SIZE:-2}
      AUTH_PG_POOL_MAX_SIZE: ${SCHOLENS_AUTH_PG_POOL_MAX_SIZE:-10}
      AUTH_ALIYUN_DM_ACCESS_KEY_ID: ${SCHOLENS_ALIYUN_DM_ACCESS_KEY_ID:?SCHOLENS_ALIYUN_DM_ACCESS_KEY_ID is required}
      AUTH_ALIYUN_DM_ACCESS_KEY_SECRET: ${SCHOLENS_ALIYUN_DM_ACCESS_KEY_SECRET:?SCHOLENS_ALIYUN_DM_ACCESS_KEY_SECRET is required}
      AUTH_ALIYUN_DM_ACCOUNT_NAME: ${SCHOLENS_ALIYUN_DM_ACCOUNT_NAME:?SCHOLENS_ALIYUN_DM_ACCOUNT_NAME is required}
      AUTH_ALIYUN_DM_FROM_ALIAS: ${SCHOLENS_ALIYUN_DM_FROM_ALIAS:-Scholens}
      AUTH_ALIYUN_DM_REPLY_TO_ADDRESS: ${SCHOLENS_ALIYUN_DM_REPLY_TO_ADDRESS:-true}
      CLIENT_DOMAIN: https://${SCHOLENS_DOMAIN:?SCHOLENS_DOMAIN is required}
      ENVIRONMENT: production
      PAPER_SEARCH_CURSOR_SECRET: ${SCHOLENS_PAPER_SEARCH_CURSOR_SECRET:?SCHOLENS_PAPER_SEARCH_CURSOR_SECRET is required}
      PAPER_SEARCH_BACKEND: ${SCHOLENS_PAPER_SEARCH_BACKEND:-postgres_fts}
      PORT: "8000"
      WEB_CONCURRENCY: ${SCHOLENS_WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: "*"
      DEEPSEEK_API_KEY: ${SCHOLENS_DEEPSEEK_API_KEY:?SCHOLENS_DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${SCHOLENS_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_STANDARD_MODEL: ${SCHOLENS_DEEPSEEK_STANDARD_MODEL:-deepseek-v4-flash}
      DEEPSEEK_DEEP_MODEL: ${SCHOLENS_DEEPSEEK_DEEP_MODEL:-deepseek-v4-pro}
      DEEPSEEK_REQUEST_TIMEOUT_SECONDS: ${SCHOLENS_DEEPSEEK_REQUEST_TIMEOUT_SECONDS:-120}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${SCHOLENS_DEEPSEEK_MAX_OUTPUT_TOKENS:-8192}
      DEEPSEEK_MAX_RETRIES: ${SCHOLENS_DEEPSEEK_MAX_RETRIES:-2}
      DEEPSEEK_STRUCTURED_RETRIES: ${SCHOLENS_DEEPSEEK_STRUCTURED_RETRIES:-2}
      JOBS_WEBHOOK_SIGNING_SECRET: ${SCHOLENS_JOBS_WEBHOOK_SIGNING_SECRET:?SCHOLENS_JOBS_WEBHOOK_SIGNING_SECRET is required}
      JOB_DISPATCH_INTERVAL_SECONDS: ${SCHOLENS_JOB_DISPATCH_INTERVAL_SECONDS:-1}
      JOB_DISPATCH_PUBLISH_LEASE_SECONDS: ${SCHOLENS_JOB_DISPATCH_PUBLISH_LEASE_SECONDS:-30}
      AI_LIMIT_REDIS_URL: redis://:${SCHOLENS_REDIS_PASSWORD:?SCHOLENS_REDIS_PASSWORD is required}@redis:6379/1
      TRANSLATION_CACHE_REDIS_URL: redis://:${SCHOLENS_REDIS_PASSWORD:?SCHOLENS_REDIS_PASSWORD is required}@redis:6379/1
      AI_MAX_INTERACTIVE_PER_USER: ${SCHOLENS_AI_MAX_INTERACTIVE_PER_USER:-8}
      AI_MAX_BACKGROUND_PER_USER: ${SCHOLENS_AI_MAX_BACKGROUND_PER_USER:-4}
      AI_MAX_AUDIO_PER_USER: ${SCHOLENS_AI_MAX_AUDIO_PER_USER:-2}
      AI_RATE_WINDOW_SECONDS: ${SCHOLENS_AI_RATE_WINDOW_SECONDS:-60}
      AI_RATE_PER_USER: ${SCHOLENS_AI_RATE_PER_USER:-60}
      AI_RATE_PER_IP: ${SCHOLENS_AI_RATE_PER_IP:-120}
      AI_CONCURRENCY_TTL_SECONDS: ${SCHOLENS_AI_CONCURRENCY_TTL_SECONDS:-7200}
      SCHOLIGHT_MCP_URL: ${SCHOLENS_SCHOLIGHT_MCP_URL:-https://scholight.sanchezcloud.net/api/mcp}
      SCHOLIGHT_MCP_DELEGATION_JWT_SECRET: ${SCHOLENS_SCHOLIGHT_MCP_DELEGATION_JWT_SECRET:?SCHOLENS_SCHOLIGHT_MCP_DELEGATION_JWT_SECRET is required}
      CONNECTOR_CREDENTIAL_ENCRYPTION_KEY: ${SCHOLENS_CONNECTOR_CREDENTIAL_ENCRYPTION_KEY:?SCHOLENS_CONNECTOR_CREDENTIAL_ENCRYPTION_KEY is required}
      STRIPE_API_KEY: ${SCHOLENS_STRIPE_API_KEY:?SCHOLENS_STRIPE_API_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${SCHOLENS_STRIPE_WEBHOOK_SECRET:?SCHOLENS_STRIPE_WEBHOOK_SECRET is required}
      STRIPE_MONTHLY_PRICE_ID: ${SCHOLENS_STRIPE_MONTHLY_PRICE_ID:?SCHOLENS_STRIPE_MONTHLY_PRICE_ID is required}
      STRIPE_YEARLY_PRICE_ID: ${SCHOLENS_STRIPE_YEARLY_PRICE_ID:?SCHOLENS_STRIPE_YEARLY_PRICE_ID is required}
      ZOTERO_CLIENT_KEY: ${SCHOLENS_ZOTERO_CLIENT_KEY:?SCHOLENS_ZOTERO_CLIENT_KEY is required}
      ZOTERO_CLIENT_SECRET: ${SCHOLENS_ZOTERO_CLIENT_SECRET:?SCHOLENS_ZOTERO_CLIENT_SECRET is required}
      ZOTERO_REDIRECT_URI: https://${SCHOLENS_DOMAIN}/api/v1/integrations/zotero/oauth/callback
      RESEND_API_KEY: ${SCHOLENS_RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${SCHOLENS_RESEND_FROM_ADDRESS:-}
      RESEND_REPLY_TO_ADDRESS: ${SCHOLENS_RESEND_REPLY_TO_ADDRESS:-}
      PROFILE_NOTIFICATION_EMAIL: ${SCHOLENS_PROFILE_NOTIFICATION_EMAIL:-}
      SOURCE_REPOSITORY_URL: ${SCHOLENS_SOURCE_REPOSITORY_URL:-https://github.com/EricSanchezok/openpaper}
      POSTHOG_API_KEY: ${SCHOLENS_POSTHOG_API_KEY:-}
      ADMIN_SESSION_SECRET: ${SCHOLENS_ADMIN_SESSION_SECRET:?SCHOLENS_ADMIN_SESSION_SECRET is required}
      DEBUG: "false"
    volumes:
      - ${SCHOLENS_RDS_CA_PATH:-/etc/scholens/global-bundle.pem}:/etc/ssl/certs/global-bundle.pem:ro
    expose:
      - "8000"
    networks:
      internal:
      edge:
        aliases:
          - scholens-api
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      jobs-api:
        condition: service_healthy

  jobs-api:
    <<: [*jobs-image, *restart]
    environment:
      <<: *jobs-environment
    expose:
      - "8001"
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    <<: [*jobs-image, *restart]
    command:
      - celery
      - --app
      - src.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${SCHOLENS_CELERY_CONCURRENCY:-2}
      - --queues=pdf_processing,zotero_sync,audio,data_table,storage_gc
      - --max-tasks-per-child=1000
      - --without-gossip
      - --without-mingle
      - --time-limit=960
      - --soft-time-limit=900
    environment:
      <<: *jobs-environment
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: [*jobs-image, *restart]
    command: ["celery", "--app", "src.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *jobs-environment
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-alpine@sha256:f45d8808ab7dfbf116d343e7814590e79483fee4c5bf21070a4d43274d217791
    <<: *restart
    environment:
      RABBITMQ_DEFAULT_USER: scholens
      RABBITMQ_DEFAULT_PASS: ${SCHOLENS_RABBITMQ_PASSWORD:?SCHOLENS_RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    <<: *restart
    environment:
      SCHOLENS_REDIS_PASSWORD: ${SCHOLENS_REDIS_PASSWORD:?SCHOLENS_REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${SCHOLENS_REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$SCHOLENS_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *api-image
    profiles: ["migrate"]
    command: ["python", "-m", "app.scripts.migrate_product"]
    environment:
      DATABASE_URL: ${SCHOLENS_MIGRATION_DATABASE_URL:?SCHOLENS_MIGRATION_DATABASE_URL is required}
    volumes:
      - ${SCHOLENS_RDS_CA_PATH:-/etc/scholens/global-bundle.pem}:/etc/ssl/certs/global-bundle.pem:ro
    networks:
      - internal
    restart: "no"
    healthcheck:
      disable: true

volumes:
  rabbitmq-data:
  redis-data:

networks:
  internal:
    internal: true
  edge:
    external: true
    name: ${SANCHEZCLOUD_EDGE_NETWORK:-sanchezcloud-edge}
