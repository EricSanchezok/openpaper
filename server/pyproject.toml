[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "scholens"
version = "0.1.0"
requires-python = ">= 3.12"
description = "An Application to Read & Understand Papers with AI"
readme = "README.md"
dependencies = [
    "cloud-auth[aliyun,fastapi] @ git+https://github.com/EricSanchezok/cloud-auth.git@9e82bb25f38a33aaa309933bfb0affb6d47c1df2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic[email]>=2.10",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "requests-oauthlib>=2.0.0",
    "sqlalchemy>=2.0.39",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.15.1",
    "python-multipart>=0.0.31",
    "pydantic-settings>=2.8.1",
    "boto3>=1.37.33",
    "sqladmin[full]>=0.25.1",
    "itsdangerous>=2.2.0",
    "gunicorn>=23.0.0",
    "mcp>=1.26,<2",
    "openai>=1.82.0",
    "posthog>=4.2.0",
    "resend>=2.10.0",
    "celery>=5.5.3",
    "stripe>=12.3.0",
    "pypdf>=6.13.3",
    "PyJWT>=2.10",
    "redis>=5.2",
]

[project.scripts]
start = "app.cli:start"

[tool.uv]
constraint-dependencies = [
    "pyasn1>=0.6.3",
    "aiohttp>=3.14.1",
    "mako>=1.3.11",
    "urllib3>=2.7.0",
    "starlette>=1.3.1",
    "idna>=3.15",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
    "ruff>=0.5",
    "types-boto3>=1.37.33",
    "types-boto3-s3>=1.37.33",
    "types-psycopg2>=2.9.21.20250318",
    "types-requests>=2.32.0.20250306",
]

[tool.mypy]
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "requests_oauthlib", "requests_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.integrations.posthog_client"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["app.integrations.stripe_webhooks"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["app.helpers.pdf_jobs", "app.helpers.referral_jobs"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
