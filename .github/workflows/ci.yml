name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: Git revision to verify
        required: false
        type: string
    secrets:
      CLOUD_AUTH_READ_TOKEN:
        description: Read-only token for the pinned cloud-auth repository
        required: true

permissions:
  contents: read

concurrency:
  group: scholens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked dependencies
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.CLOUD_AUTH_READ_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --frozen --group dev
      - name: Ruff format
        run: uv run ruff format --check app tests migrations
      - name: Ruff
        run: uv run ruff check app tests migrations
      - name: Strict type check
        run: uv run mypy app
      - name: Static cleanliness gates
        run: |
          if grep -R --exclude-dir=__pycache__ --line-number \
            -E 'print\(|datetime\.utcnow\(|app\.api\.types' app; then
            printf 'Forbidden legacy or debug pattern found in Server business code\n' >&2
            exit 1
          fi
      - name: Tests
        run: uv run pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn tsc --noEmit
      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium
      - name: Browser regressions
        run: yarn test:e2e
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          yarn build 2>&1 | tee production-build.log
          if grep -Eiq \
            'window is not defined|document is not defined|please use (the )?legacy build' \
            production-build.log; then
            printf 'Browser-only PDF.js code leaked into the server build\n' >&2
            exit 1
          fi

  jobs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Ruff
        run: uv run ruff check src tests
      - name: Strict type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q

  deployment-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-password
          POSTGRES_DB: sanchezcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanchezcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check out pinned cloud-auth migration owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: EricSanchezok/cloud-auth
          ref: 3d95e2a8bb351c0d99aefca9572fb25deb88cc52
          token: ${{ secrets.CLOUD_AUTH_READ_TOKEN }}
          path: .ci/cloud-auth
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install pinned auth migration tool
        working-directory: .ci/cloud-auth
        run: uv sync --frozen
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate deployment files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          bash -n deploy/production/release.sh deploy/production/smoke.sh deploy/production/wait-ssm.sh
          shellcheck deploy/production/release.sh deploy/production/smoke.sh deploy/production/wait-ssm.sh
      - name: Validate production Compose
        env:
          SCHOLENS_API_IMAGE: registry.example/scholens/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SCHOLENS_CLIENT_IMAGE: registry.example/scholens/client@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SCHOLENS_JOBS_IMAGE: registry.example/scholens/jobs@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          SCHOLENS_DOMAIN: scholens.example.invalid
          SCHOLENS_AWS_REGION: us-east-1
          SCHOLENS_APP_DATABASE_URL: postgresql://app:password@postgres.example.invalid/sanchezcloud
          SCHOLENS_MIGRATION_DATABASE_URL: postgresql://migrator:password@postgres.example.invalid/sanchezcloud
          SCHOLENS_AUTH_JWT_SECRET: fixture-secret-at-least-thirty-two-bytes
          SCHOLENS_ADMIN_SESSION_SECRET: fixture-admin-session-secret-at-least-thirty-two-bytes
          SCHOLENS_RABBITMQ_PASSWORD: fixture-rabbit-password
          SCHOLENS_REDIS_PASSWORD: fixture-redis-password
          SCHOLENS_ALIYUN_DM_ACCESS_KEY_ID: fixture
          SCHOLENS_ALIYUN_DM_ACCESS_KEY_SECRET: fixture
          SCHOLENS_ALIYUN_DM_ACCOUNT_NAME: sender@example.invalid
          SCHOLENS_S3_BUCKET_NAME: fixture-bucket
          SCHOLENS_CLOUDFLARE_BUCKET_NAME: fixture-bucket.s3.us-east-1.amazonaws.com
          SCHOLENS_DEEPSEEK_API_KEY: fixture
          SCHOLENS_MINERU_API_TOKEN: fixture
          SCHOLENS_MOSS_API_KEY: fixture
          SCHOLENS_MOSS_VOICE_ID: fixture
          SCHOLENS_JOBS_WEBHOOK_SIGNING_SECRET: fixture-signing-secret-at-least-thirty-two-bytes
          SCHOLENS_ANYSEARCH_API_KEY: fixture
          SCHOLENS_SCHOLIGHT_MCP_DELEGATION_JWT_SECRET: fixture-delegation-secret-at-least-thirty-two-bytes
          SCHOLENS_STRIPE_API_KEY: fixture
          SCHOLENS_STRIPE_WEBHOOK_SECRET: fixture
          SCHOLENS_STRIPE_MONTHLY_PRICE_ID: fixture
          SCHOLENS_STRIPE_YEARLY_PRICE_ID: fixture
          SCHOLENS_ZOTERO_CLIENT_KEY: fixture
          SCHOLENS_ZOTERO_CLIENT_SECRET: fixture
        run: docker compose -f deploy/production/compose.yaml config --quiet
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: scholens-api:ci
          secrets: |
            github_token=${{ secrets.CLOUD_AUTH_READ_TOKEN }}
      - name: Build jobs image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: jobs/Dockerfile
          push: false
      - name: Build client image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: client/Dockerfile
          push: false
      - name: Verify independent migrations with least-privilege roles
        env:
          PGPASSWORD: migration-test-password
          AUTH_MIGRATOR_PASSWORD: auth-migrator-test-password
          MIGRATOR_PASSWORD: migrator-test-password
          APP_PASSWORD: app-test-password
        run: |
          psql -h 127.0.0.1 -U postgres -d sanchezcloud -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE auth_migrator LOGIN PASSWORD '$AUTH_MIGRATOR_PASSWORD';
             CREATE ROLE scholens_migrator LOGIN PASSWORD '$MIGRATOR_PASSWORD';
             CREATE ROLE scholens_app LOGIN PASSWORD '$APP_PASSWORD';"

          for phase in before after-auth after-scholens; do
            psql -h 127.0.0.1 -U postgres -d sanchezcloud \
              -v app_role=scholens_app \
              -v auth_migrator_role=auth_migrator \
              -v product_migrator_role=scholens_migrator \
              -f deploy/production/bootstrap-db.sql

            if [[ $phase == before ]]; then
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                uv run --project .ci/cloud-auth cloud-auth migrate
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                uv run --project .ci/cloud-auth cloud-auth check-schema
            elif [[ $phase == after-auth ]]; then
              for _ in 1 2; do
                docker run --rm --network host \
                  -e DATABASE_URL="postgresql+psycopg2://scholens_migrator:${MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                  scholens-api:ci python -m app.scripts.migrate_product
              done
              docker run --rm --network host \
                -e DATABASE_URL="postgresql+psycopg2://scholens_migrator:${MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                scholens-api:ci alembic check
            fi
          done

          psql -h 127.0.0.1 -U postgres -d sanchezcloud -tAc \
            "SELECT to_regclass('auth.schema_migrations') IS NOT NULL
                 AND to_regclass('scholens.schema_migrations') IS NOT NULL
                 AND to_regclass('auth.users') IS NOT NULL
                 AND to_regclass('auth.refresh_tokens') IS NOT NULL
                 AND NOT has_table_privilege(
                   'scholens_app', 'auth.users', 'DELETE'
                 )
                 AND NOT has_table_privilege(
                   'scholens_app', 'auth.refresh_tokens', 'DELETE'
                 )
                 AND to_regclass('scholens.documents') IS NOT NULL
                 AND to_regclass('scholens.library_papers') IS NOT NULL
                 AND to_regclass('scholens.user_profiles') IS NOT NULL
                 AND to_regclass('scholens.discover_searches') IS NULL
                 AND EXISTS (
                   SELECT 1
                   FROM pg_trigger
                   WHERE tgname = 'tsvectorupdate' AND NOT tgisinternal
                 )
                 AND EXISTS (
                   SELECT 1
                   FROM pg_trigger
                   WHERE tgname = 'document_passages_tsvectorupdate' AND NOT tgisinternal
                 )
                 AND NOT EXISTS (
                   SELECT 1 FROM pg_tables WHERE schemaname = 'public'
                 )
                 AND NOT has_database_privilege('auth_migrator', current_database(), 'CREATE')
                 AND NOT has_database_privilege('scholens_migrator', current_database(), 'CREATE')
                 AND NOT has_database_privilege('scholens_app', current_database(), 'CREATE')" \
            | grep -qx t

          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c \
            "BEGIN;
             INSERT INTO auth.users (email, password_hash)
               VALUES
                 ('ci-owner@example.invalid', 'fixture'),
                 ('ci-collaborator@example.invalid', 'fixture');
             INSERT INTO scholens.user_profiles (user_id)
               SELECT id FROM auth.users
               WHERE email = 'ci-owner@example.invalid';
             INSERT INTO scholens.documents
               (id, sha256, original_filename, mime_type, size_bytes,
                s3_object_key, title, raw_content, processing_status,
                created_by_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000001',
                 repeat('a', 64),
                 'fixture.pdf',
                 'application/pdf',
                 1024,
                 'documents/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/source.pdf',
                 'Semantic search',
                 'retrieval augmented generation',
                 'completed',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid')
               );
             INSERT INTO scholens.library_papers
               (id, user_id, document_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000007',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 '00000000-0000-0000-0000-000000000001'
               );
             INSERT INTO scholens.document_passages
               (document_id, start_line, end_line, content)
               VALUES (
                 '00000000-0000-0000-0000-000000000001',
                 1,
                 1,
                 'retrieval augmented generation'
               );
             INSERT INTO scholens.projects
               (id, title, description, owner_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000002',
                 'CI project',
                 'relationship test',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid')
               );
             INSERT INTO scholens.project_collaborators
               (id, project_id, user_id, can_edit_project,
                can_manage_papers, can_manage_collaborators)
               VALUES (
                 '00000000-0000-0000-0000-000000000003',
                 '00000000-0000-0000-0000-000000000002',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-collaborator@example.invalid'),
                 true,
                 true,
                 false
               );
             INSERT INTO scholens.project_papers
               (id, document_id, project_id, added_by_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000004',
                 '00000000-0000-0000-0000-000000000001',
                 '00000000-0000-0000-0000-000000000002',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-collaborator@example.invalid')
               );
             INSERT INTO scholens.token_weekly_usage
               (user_id, week_start, used_tokens)
               VALUES (
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 date_trunc('week', now())::date,
                 17
               );
             INSERT INTO scholens.token_usage_events
               (id, user_id, week_start, idempotency_key, operation_id,
                feature, provider, model, reasoning_level, prompt_tokens,
                completion_tokens, reasoning_tokens, cache_hit_tokens,
                cache_miss_tokens, total_tokens, status)
               VALUES (
                 '00000000-0000-0000-0000-000000000005',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 date_trunc('week', now())::date,
                 'ci-token-event',
                 'ci-operation',
                 'chat',
                 'deepseek',
                 'fixture-model',
                 'standard',
                 11,
                 6,
                 0,
                 0,
                 0,
                 17,
                 'settled'
               );
             INSERT INTO scholens.subscriptions
               (id, user_id, plan, status, cancel_at_period_end)
               VALUES (
                 '00000000-0000-0000-0000-000000000006',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 'basic',
                 'active',
                 false
               );
             SELECT 1 / (
               (SELECT ts_vector IS NOT NULL FROM scholens.documents
                WHERE id = '00000000-0000-0000-0000-000000000001')::int
               *
               (SELECT ts_vector IS NOT NULL FROM scholens.document_passages
                WHERE document_id = '00000000-0000-0000-0000-000000000001')::int
               *
               (SELECT count(*) = 1 FROM scholens.library_papers
                WHERE document_id = '00000000-0000-0000-0000-000000000001')::int
               *
               (SELECT count(*) = 1 FROM scholens.project_papers
                WHERE project_id = '00000000-0000-0000-0000-000000000002')::int
               *
               (SELECT used_tokens = 17 FROM scholens.token_weekly_usage
                WHERE user_id = (
                  SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'
                ))::int
               *
               (SELECT count(*) = 1 FROM scholens.subscriptions
                WHERE user_id = (
                  SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'
                ))::int
             );
             DELETE FROM scholens.projects
               WHERE id = '00000000-0000-0000-0000-000000000002';
             SELECT 1 / (
               (NOT EXISTS (
                 SELECT 1 FROM scholens.project_collaborators
                 WHERE project_id = '00000000-0000-0000-0000-000000000002'
               ))::int
               *
               (NOT EXISTS (
                 SELECT 1 FROM scholens.project_papers
                 WHERE project_id = '00000000-0000-0000-0000-000000000002'
               ))::int
               *
               (EXISTS (
                 SELECT 1 FROM scholens.documents
                 WHERE id = '00000000-0000-0000-0000-000000000001'
               ))::int
               *
               (EXISTS (
                 SELECT 1 FROM scholens.library_papers
                 WHERE document_id = '00000000-0000-0000-0000-000000000001'
               ))::int
             );
             ROLLBACK;"

          if PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c "CREATE TABLE public.app_must_not_create (id integer)"; then
            printf 'scholens_app unexpectedly has DDL privileges\n' >&2
            exit 1
          fi

          if PGPASSWORD="$MIGRATOR_PASSWORD" psql -h 127.0.0.1 -U scholens_migrator \
            -d sanchezcloud -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE auth.product_migrator_must_not_create (id integer)"; then
            printf 'scholens_migrator unexpectedly has auth DDL privileges\n' >&2
            exit 1
          fi

          if PGPASSWORD="$AUTH_MIGRATOR_PASSWORD" psql -h 127.0.0.1 -U auth_migrator \
            -d sanchezcloud -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE scholens.auth_migrator_must_not_create (id integer)"; then
            printf 'auth_migrator unexpectedly has Scholens DDL privileges\n' >&2
            exit 1
          fi
